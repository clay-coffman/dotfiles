# Global dev-tool pins, deployed to ~/.config/mise/config.toml.
#
# Migrated from asdf's ~/.tool-versions, which pinned the same six versions under
# asdf's plugin names "golang" and "nodejs". Those two are spelled "go" and
# "node" here. That rename is a consistency choice rather than a requirement:
# mise normalises the asdf spellings when it parses a config file, so "golang"
# would still have resolved, but its registry has no such entry, which means
# `mise registry golang` and `mise use golang@1.25.3` both fail with "tool not
# found in registry". Keeping the canonical names means every name in this file
# is one the CLI will also accept.
#
# Project repositories can still override any of these with their own mise.toml
# or .tool-versions file, because mise reads both formats.

[tools]
go = "1.25.3"
node = "24.14.1"
# Bumped from the 3.13.0 that asdf pinned. mise downloads prebuilt CPython from
# python-build-standalone and verifies the GitHub artifact attestation on it,
# which proves the tarball really came from that project's CI. The 3.13.0 build
# dates from October 2024 and has no attestation published, so mise refuses it
# outright with "No GitHub artifact attestations found". Rather than turn the
# check off, this tracks a current 3.13 patch, which verifies cleanly. Patch
# releases within 3.13 keep the same ABI, so compiled extensions still work.
python = "3.13.15"
ruby = "3.4.7"
# mise manages rust through rustup rather than installing it itself, so the
# toolchain lands in rustup's own directory instead of under mise's installs.
rust = "1.90.0"
lua = "5.1"

# Infrastructure and toolchain binaries. These used to come from Homebrew and
# Docker Desktop, so nothing pinned them and they drifted on every `brew
# upgrade`. mise pulls them from the aqua backend, which verifies checksums and,
# where upstream publishes them, signatures.
#
# terraform matches the pin in a work infra repo's .tool-versions. Homebrew happened to
# satisfy that by coincidence, which would have broken silently on the next
# upgrade of the hashicorp/tap formula.
terraform = "1.15.8"
# Pinned to the version Docker Desktop was already shipping, so behaviour is
# unchanged today. Docker's own root-owned symlink at /usr/local/bin/kubectl is
# left in place but now sits behind mise on PATH. Keep this within one minor
# version of the cluster being targeted.
kubectl = "1.36.1"
# The aqua backend downloads and unpacks Amazon's own AWSCLIV2 .pkg, bundled
# Python included, so this is the official distribution rather than a repackage.
# It was previously a bare pkg install under /usr/local/aws-cli that no Brewfile
# or chezmoi file tracked, so a fresh machine would not have reproduced it. That
# pkg is left on disk, shadowed by mise on PATH, because removing it needs sudo
# and buys nothing.
awscli = "2.35.21"
uv = "0.12.0"

# Application-level tools, kept here so a fresh laptop reproduces them from
# `chezmoi apply` alone rather than from memory.
#
# The npm and gem entries matter more than they look. Packages installed with a
# bare `npm install -g` or `gem install` land inside
# ~/.local/share/mise/installs/<tool>/<version>/, so they are invisible to every
# config file AND they are abandoned the moment the runtime pin is bumped. The
# asdf-to-mise migration lost both of these exactly that way and they had to be
# reinstalled by hand. Declaring them as mise tools makes them survive a runtime
# bump and reproduce on a new machine.
"npm:agent-browser" = "0.34.0"
"gem:cocoapods" = "1.17.0"
# Maestro was previously installed by its own upstream script into ~/.maestro and
# tracked nowhere. Pinned to the version that was already installed, so nothing
# changes behaviourally. It needs a JDK, which the java pin above provides.
"github:mobile-dev-inc/maestro" = "cli-2.6.1"
# Temurin rather than a bare "17". A bare major resolves to the openjdk vendor,
# and mise only offers openjdk 17.0.0 through 17.0.2 because openjdk.org
# publishes just the current GA build and does not archive old patches. Temurin
# archives every patch, so temurin-17 tracks a genuinely current 17 (17.0.20 at
# time of writing) instead of pinning something four years stale.
#
# mise sets JAVA_HOME itself whenever java is active, which is why the Maestro
# block in .zshrc no longer exports it by hand. That only works under
# `mise activate`; shims alone do not set environment variables.
java = "temurin-17"

# "Idiomatic" version files are the per-language pin files that predate mise,
# such as .nvmrc and .node-version for Node. mise ignores every one of them by
# default, and asdf was also ignoring them here because there was no ~/.asdfrc
# enabling legacy_version_file. Node is opted in because the ehr repo and its
# worktrees pin 24.18.0 in .nvmrc while the global pin above is 24.14.1, so
# without this line those repos would silently build on the wrong minor.
# This is the one behavioural difference from the old asdf setup. Delete the
# setting below to go back to global-pin-only resolution.
#
# Keep prose above this header, not between the header and its keys: mise
# rewrites this file when it normalises settings and drops comments attached to
# keys inside the table, which then shows up as a phantom `chezmoi diff`.
[settings]
idiomatic_version_file_enable_tools = ["node"]
